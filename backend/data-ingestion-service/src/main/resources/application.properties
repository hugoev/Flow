# Data Ingestion Service Configuration
# Clean, well-documented configuration with sensible defaults

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Information
spring.application.name=data-ingestion-service
app.version=1.0.0
app.description=Microservice for ingesting vehicle telemetry data

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=1
spring.kafka.producer.buffer-memory=33554432

# Kafka Topics
kafka.topics.telemetry=vehicle-telemetry

# Jackson Configuration (JSON processing)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.com.vehicletelemetry.ingestion=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN

# Management Endpoints (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# HTTP Client Configuration
spring.web.client.connect-timeout=5000ms
spring.web.client.read-timeout=10000ms

# Thread Pool Configuration (for async processing)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ingestion-task-
