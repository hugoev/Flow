# Data Processing Service Configuration
# Clean, well-documented configuration with sensible defaults

# Server Configuration
server.port=8082
server.servlet.context-path=/api

# Application Information
spring.application.name=data-processing-service
app.version=1.0.0
app.description=Microservice for processing and storing vehicle telemetry data

# Cassandra Configuration - Working Configuration
spring.cassandra.keyspace-name=vehicle_telemetry
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=telemetry-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.session-timeout=30000
spring.kafka.consumer.request-timeout=40000
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.fetch-min-size=1024
spring.kafka.consumer.fetch-max-wait=500

# Jackson Configuration (JSON processing)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.com.vehicletelemetry.processing=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.datastax.oss.driver=WARN
logging.level.org.apache.cassandra=WARN

# Management Endpoints (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics,cassandra
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@

# Thread Pool Configuration (for async processing)
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=30
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=processing-task-

# Cassandra Pool Configuration
spring.cassandra.pool.heartbeat-interval=30s

# Spring Boot Startup Optimizations
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.cassandra.connection.init-query-timeout=10s
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.request-timeout=10s
spring.cassandra.pool.idle-timeout=60s
