# Vehicle Telemetry System - Production IoT Architecture
# Real-world architecture with MQTT, Kafka, Redis, and Cassandra
# Following industry standards used by Tesla, BMW, and Uber

services:
  # MQTT Broker - Real vehicle communication protocol
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: vts-mosquitto
    ports:
      - "1883:1883"    # MQTT port
      - "9001:9001"    # WebSocket port
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: vts-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka Connect - Enterprise integration
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.0
    hostname: kafka-connect
    container_name: vts-kafka-connect
    depends_on:
      - kafka
    ports:
      - "8084:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    volumes:
      - kafka-connect-data:/var/lib/kafka-connect/data
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
  # Apache Kafka with Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: vts-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: vts-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: ""
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Cassandra
  cassandra:
    image: cassandra:4.0
    hostname: cassandra
    container_name: vts-cassandra
    ports:
      - "9042:9042"
      - "7001:7000"
    environment:
      CASSANDRA_CLUSTER_NAME: VehicleTelemetryCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_SEEDS: cassandra
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cassandra/init:/docker-entrypoint-initdb.d
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Data Ingestion Service - MQTT to Kafka Bridge
  data-ingestion-service:
    build:
      context: ../../backend/data-ingestion-service
      dockerfile: Dockerfile
    container_name: vts-data-ingestion
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_SERVLET_CONTEXT_PATH: /api
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_TOPIC_PREFIX: vehicles
      MQTT_QOS: 1
      LOGGING_LEVEL_COM_VEHICLETELEMETRY: INFO
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/telemetry/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Processing Service
  data-processing-service:
    build:
      context: ../../backend/data-processing-service
      dockerfile: Dockerfile
    container_name: vts-data-processing
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: 9042
      LOGGING_LEVEL_COM_VEHICLETELEMETRY: INFO
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/processing/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Telemetry Streaming Service - Real-time data streaming
  telemetry-streaming-service:
    build:
      context: ../../backend/telemetry-streaming-service
      dockerfile: Dockerfile
    container_name: vts-telemetry-streaming
    depends_on:
      data-processing-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVICES_PROCESSING_SERVICE_URL: http://data-processing-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 300
      LOGGING_LEVEL_COM_VEHICLETELEMETRY: INFO
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/telemetry/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Dashboard
  frontend-dashboard:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: vts-frontend
    depends_on:
      telemetry-streaming-service:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vts-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: VehicleTelemetryCluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - vehicle-telemetry-network
    restart: unless-stopped

  # Monitoring - Cassandra Web UI (Optional - can be removed if not needed)
  # cassandra-web:
  #   image: omerio/cassandra-web:latest
  #   container_name: vts-cassandra-web
  #   depends_on:
  #     cassandra:
  #       condition: service_healthy
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     CASSANDRA_HOST: cassandra
  #     CASSANDRA_PORT: 9042
  #   networks:
  #     - vehicle-telemetry-network
  #   restart: unless-stopped

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  redis-data:
    driver: local
  kafka-connect-data:
    driver: local
  cassandra-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local

networks:
  vehicle-telemetry-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
