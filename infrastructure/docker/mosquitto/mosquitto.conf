# Mosquitto MQTT Broker Configuration
# Production-ready configuration for vehicle telemetry

# Network settings
listener 1883
listener 9001
protocol websockets

# Security settings (for development - in production use TLS)
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# Message size limits
max_packet_size 268435456

# Keep alive settings
max_keepalive 65535

# Bridge settings (for connecting to Kafka)
# connection kafka-bridge
# address kafka:29092
# topic vehicles/+/telemetry both 0
# remote_username kafka
# remote_password kafka
