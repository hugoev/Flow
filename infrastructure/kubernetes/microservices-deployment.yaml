# Vehicle Telemetry System - Microservices Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: data-ingestion
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-ingestion-service
  template:
    metadata:
      labels:
        app: data-ingestion-service
        component: data-ingestion
        tier: backend
    spec:
      containers:
        - name: data-ingestion
          image: vehicle-telemetry/data-ingestion-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: kafka.bootstrap.servers
            - name: LOGGING_LEVEL_COM_VEHICLETELEMETRY
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: logging.level.com.vehicletelemetry
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/telemetry/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/telemetry/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: data-ingestion
spec:
  selector:
    app: data-ingestion-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: data-processing
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-processing-service
  template:
    metadata:
      labels:
        app: data-processing-service
        component: data-processing
        tier: backend
    spec:
      containers:
        - name: data-processing
          image: vehicle-telemetry/data-processing-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: kafka.bootstrap.servers
            - name: SPRING_CASSANDRA_CONTACT_POINTS
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: cassandra.contact.points
            - name: SPRING_CASSANDRA_PORT
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: cassandra.port
            - name: SPRING_CASSANDRA_KEYSPACE_NAME
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: cassandra.keyspace
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/processing/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/processing/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: data-processing-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: data-processing
spec:
  selector:
    app: data-processing-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: api-gateway
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
        component: api-gateway
        tier: frontend
    spec:
      containers:
        - name: api-gateway
          image: vehicle-telemetry/api-gateway-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SERVICES_PROCESSING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: vts-config
                  key: processing.service.url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/telemetry/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/telemetry/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: api-gateway
spec:
  selector:
    app: api-gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
