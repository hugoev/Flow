# Flow - Real-Time Vehicle Fleet Monitoring & Analytics - Persistent Storage Configuration
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  namespace: vehicle-telemetry
  labels:
    app: vehicle-telemetry-system
    component: storage
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-ssd
  replication-type: regional-pd
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

# Note: Kafka and Zookeeper use ephemeral storage for development
# Persistent storage is only configured for Cassandra
